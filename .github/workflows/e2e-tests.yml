name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_visual_snapshots:
        description: Generate Linux reference images for manual review (not a visual comparison)
        type: boolean
        default: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  BASE_URL: 'https://douglasqa.netlify.app/'

jobs:
  quality:
    name: Build and budgets
    if: ${{ !inputs.update_visual_snapshots }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check:js
      - run: npm run test:unit
      - run: npm audit --audit-level=moderate
      - run: npm run test:budget

  deployment:
    name: Verify public deployment
    if: ${{ !inputs.update_visual_snapshots }}
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/verify-deployment.mjs
        env:
          EXPECTED_COMMIT: ${{ github.ref == 'refs/heads/main' && github.sha || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-verified
          path: artifacts/deployment/
          retention-days: 7

  playwright:
    name: Playwright ${{ matrix.browser }}
    needs: deployment
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:playwright -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  cypress:
    name: Cypress E2E
    needs: deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:cypress

  selenium:
    name: Selenium WebDriver E2E
    needs: deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:selenium

  robot:
    name: Robot Framework E2E
    needs: deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-robot.txt
      - run: npm ci
      - run: pip install -r requirements-robot.txt
      - run: npm run test:robot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-report
          path: artifacts/robot/
          retention-days: 7

  performance:
    name: Lighthouse mobile
    needs: deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 7

  coverage:
    name: Production JavaScript coverage
    needs: deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-coverage
          path: |
            artifacts/coverage/
            playwright-report/
            test-results/
          retention-days: 7

  links:
    name: Public link availability
    needs: deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:links
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-links
          path: artifacts/links/
          retention-days: 7

  visual:
    name: Visual regression on public site
    needs: deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-comparison
          path: |
            artifacts/visual-report/
            artifacts/visual-results/
          retention-days: 7

  visual-references:
    name: Generate reference images for review
    if: ${{ inputs.update_visual_snapshots }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:deployment
      - run: npm run test:visual -- --update-snapshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-references-for-review
          path: |
            tests/visual/baselines/
            artifacts/deployment/
          retention-days: 7

  appium:
    name: Appium Android emulator - public Chrome
    needs: deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/appium/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm ci --prefix tests/appium
      - name: Enable hardware acceleration for the disposable CI emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: npm run test:appium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-android
          path: artifacts/appium/
          retention-days: 7
